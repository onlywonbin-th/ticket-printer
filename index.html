<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เครื่องปริ้นตั๋ว Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9e4f6;
    --ink:#25123f;
    --muted:#6a5d86;
    --line:#bfb3dc;
    --pink:#ff6fbd;
    --plum:#2a0f4d;
    --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:40px 24px 80px;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,400px);
    gap:56px;
    align-items:start;
  }
  h1{font-size:clamp(30px,4.6vw,46px);line-height:1.15;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
  .lead{margin:0 0 32px;color:var(--muted);font-size:17px;line-height:1.6;max-width:44ch}

  /* ---------- form ---------- */
  .field{margin-bottom:22px}
  .field > label,.field > .lbl{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
  .field small{font-weight:400;color:var(--muted)}
  input[type=text]{
    width:100%;font:inherit;font-size:17px;padding:13px 16px;
    border:2px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink);
  }
  input[type=text]::placeholder{color:#a89cc4}
  input[type=text]:focus-visible,.drop:focus-within,button:focus-visible,.check input:focus-visible + span{
    outline:3px solid var(--pink);outline-offset:2px;
  }
  .drop{
    display:flex;align-items:center;gap:18px;
    border:2px dashed var(--line);border-radius:16px;padding:16px;
    background:rgba(255,255,255,.55);cursor:pointer;transition:border-color .15s,background .15s;
  }
  .drop:hover,.drop.over{border-color:var(--pink);background:#fff}
  .drop input{position:absolute;opacity:0;width:1px;height:1px}
  .thumb{
    width:84px;height:112px;flex:none;border-radius:10px;background:#ddd6ee;
    display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:30px;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .drop b{display:block;font-size:17px;margin-bottom:4px}
  .drop span.hint{color:var(--muted);font-size:14px;line-height:1.5}
  .err{color:#b4235a;font-size:14px;margin-top:8px;min-height:1em}

  .check{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;user-select:none;margin-bottom:26px}
  .check input{width:18px;height:18px;accent-color:var(--plum)}

  .actions{display:flex;flex-wrap:wrap;gap:12px}
  button{
    font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;
    padding:15px 26px;cursor:pointer;transition:transform .1s,opacity .15s,background .15s;
  }
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--plum);color:#fff}
  .primary:hover:not(:disabled){background:#3d1775}
  .ghost{background:transparent;color:var(--plum);border:2px solid var(--plum);padding:13px 22px}
  .ghost:hover:not(:disabled){background:rgba(42,15,77,.08)}
  .after{display:none;margin-top:14px}
  .after.show{display:flex}

  /* ---------- printer ---------- */
  .stage{width:100%;max-width:380px;margin:0 auto}
  .printer{
    position:relative;z-index:2;
    background:linear-gradient(180deg,#fdfcff 0%,#e6e1f1 100%);
    border-radius:28px 28px 16px 16px;
    padding:20px 22px 34px;
    box-shadow:0 22px 34px -16px rgba(42,15,77,.45),inset 0 -5px 0 #cdc5e0,inset 0 2px 0 #fff;
  }
  .panel{display:flex;align-items:center;gap:14px}
  .screen{
    flex:1;background:#1c2a20;border-radius:8px;padding:9px 12px;
    font-family:'Courier New',ui-monospace,monospace;font-weight:700;font-size:15px;
    color:#8dffa8;letter-spacing:.08em;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
  }
  .leds{display:flex;gap:8px}
  .led{width:11px;height:11px;border-radius:50%;background:#bdb5d1;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
  .led.on{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
  .printing .led.b{background:var(--pink);box-shadow:0 0 8px var(--pink);animation:blink .35s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  .vents{display:flex;flex-direction:column;gap:5px;margin:16px 6px 0}
  .vents i{display:block;height:4px;border-radius:2px;background:#d3cce4}
  .slot{
    position:absolute;left:6%;right:6%;bottom:-3px;height:18px;
    background:#12061f;border-radius:9px;
    box-shadow:inset 0 4px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.7);
  }
  .out{
    position:relative;z-index:1;
    width:86%;margin:-10px auto 0;
    aspect-ratio:640/1120;
    clip-path:inset(0 -60px -900px -60px);
  }
  .out img{
    position:absolute;left:0;top:0;width:100%;display:block;
    transform:translateY(-100%);
    filter:drop-shadow(0 10px 14px rgba(42,15,77,.35));
  }

  .foot{margin-top:28px;color:var(--muted);font-size:13px;text-align:center}

  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;gap:40px;padding:28px 18px 64px}
    .stage{order:2}
  }
  @media (prefers-reduced-motion:reduce){
    .printing .led.b{animation:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <h1>ปริ้นตั๋วจากรูป certificate</h1>
    <p class="lead">ใส่รูป certificate กับชื่อของคุณ แล้วตั๋วจะค่อย ๆ ไหลออกมาจากเครื่องปริ้น</p>

    <div class="field">
      <span class="lbl">รูป certificate</span>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*">
        <div class="thumb" id="thumb" aria-hidden="true">+</div>
        <div>
          <b id="dropTitle">เลือกรูปภาพ</b>
          <span class="hint">คลิกเพื่อเลือกไฟล์ หรือลากรูปมาวางตรงนี้ (PNG, JPG)</span>
        </div>
      </label>
      <div class="err" id="err" role="alert"></div>
    </div>

    <div class="field">
      <label for="name">ชื่อบนตั๋ว</label>
      <input type="text" id="name" maxlength="28" placeholder="ชื่อของคุณ" autocomplete="off">
    </div>

    <div class="field">
      <label for="title">หัวตั๋ว <small>(ไม่ใส่ก็ได้)</small></label>
      <input type="text" id="title" maxlength="26" placeholder="เช่น VOTING TICKET" autocomplete="off">
    </div>

    <label class="check"><input type="checkbox" id="sound" checked><span>เปิดเสียงเครื่องพิมพ์</span></label>

    <div class="actions">
      <button class="primary" id="print" disabled>ปริ้นตั๋ว</button>
    </div>
    <div class="actions after" id="after">
      <button class="ghost" id="download">ดาวน์โหลดตั๋ว (PNG)</button>
      <button class="ghost" id="tear">ฉีกตั๋วออก</button>
    </div>
  </main>

  <section class="stage" aria-label="เครื่องปริ้นตั๋ว">
    <div class="printer" id="printer">
      <div class="panel">
        <div class="screen" id="status">READY</div>
        <div class="leds"><span class="led on"></span><span class="led b"></span></div>
      </div>
      <div class="vents"><i></i><i></i><i></i></div>
      <div class="slot"></div>
    </div>
    <div class="out" id="out"><img id="ticket" alt="ตั๋วที่ปริ้นออกมา"></div>
  </section>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const fileIn = $('#file'), drop = $('#drop'), thumb = $('#thumb'), dropTitle = $('#dropTitle'), errEl = $('#err');
  const nameIn = $('#name'), titleIn = $('#title'), soundIn = $('#sound');
  const printBtn = $('#print'), after = $('#after'), dlBtn = $('#download'), tearBtn = $('#tear');
  const statusEl = $('#status'), printer = $('#printer'), out = $('#out'), ticketImg = $('#ticket');

  let certImg = null, lastCanvas = null, busy = false, hasTicket = false, lastName = '';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- image input ---------- */
  function loadFile(f){
    errEl.textContent = '';
    if(!f) return;
    if(!f.type.startsWith('image/')){ errEl.textContent = 'ไฟล์นี้ไม่ใช่รูปภาพ ลองเลือกไฟล์ PNG หรือ JPG'; return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      certImg = img;
      thumb.innerHTML = '';
      const t = new Image(); t.src = url; t.alt = '';
      thumb.appendChild(t);
      dropTitle.textContent = 'เปลี่ยนรูป';
      printBtn.disabled = busy;
    };
    img.onerror = () => { errEl.textContent = 'เปิดรูปนี้ไม่ได้ ลองไฟล์อื่น'; };
    img.src = url;
  }
  fileIn.addEventListener('change', e => loadFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
  nameIn.addEventListener('keydown', e => { if(e.key === 'Enter') printTicket(); });

  /* ---------- ticket drawing (canvas) ---------- */
  const W = 640, H = 1120, PERF = 880, NOTCH = 26;

  function ticketPath(ctx){
    const r = 30;
    ctx.beginPath();
    ctx.moveTo(r,0);
    ctx.lineTo(W-r,0); ctx.arcTo(W,0,W,r,r);
    ctx.lineTo(W,PERF-NOTCH); ctx.arc(W,PERF,NOTCH,-Math.PI/2,Math.PI/2,true);
    ctx.lineTo(W,H-r); ctx.arcTo(W,H,W-r,H,r);
    ctx.lineTo(r,H); ctx.arcTo(0,H,0,H-r,r);
    ctx.lineTo(0,PERF+NOTCH); ctx.arc(0,PERF,NOTCH,Math.PI/2,-Math.PI/2,true);
    ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r);
    ctx.closePath();
  }
  function rr(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function rng(seed){ // mulberry32
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function fitText(ctx,text,weight,start,min,maxW){
    let s = start;
    do { ctx.font = `${weight} ${s}px Prompt, sans-serif`; s -= 2; }
    while(ctx.measureText(text).width > maxW && s > min);
  }
  const pad = n => String(n).padStart(2,'0');

  async function drawTicket(){
    const name = (nameIn.value.trim() || 'GUEST');
    const title = (titleIn.value.trim() || 'CERTIFICATE TICKET');
    lastName = name;
    try{
      await Promise.all([
        document.fonts.load('800 40px Prompt', name + title),
        document.fonts.load('500 20px Prompt', 'TICKET CODE NAME NO.')
      ]);
    }catch(e){}

    const code = `${100+Math.floor(Math.random()*900)}-${100+Math.floor(Math.random()*900)}-${1000+Math.floor(Math.random()*9000)}`;
    const d = new Date();
    const date = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;

    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    ctx.save();
    ticketPath(ctx); ctx.clip();

    // body
    let g = ctx.createLinearGradient(0,0,W,PERF);
    g.addColorStop(0,'#3d1478'); g.addColorStop(1,'#1b0838');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    g = ctx.createRadialGradient(540,90,0,540,90,340);
    g.addColorStop(0,'rgba(255,111,189,.45)'); g.addColorStop(1,'rgba(255,111,189,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,PERF);
    g = ctx.createRadialGradient(60,760,0,60,760,300);
    g.addColorStop(0,'rgba(120,80,255,.4)'); g.addColorStop(1,'rgba(120,80,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,PERF);

    // stub
    ctx.fillStyle = '#ff8ccb'; ctx.fillRect(0,PERF,W,H-PERF);

    // title
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ff8ccb';
    fitText(ctx,title,800,42,22,520);
    ctx.fillText(title,60,84);

    // certificate frame
    const fx = 60, fy = 112, fw = 520, fh = 596;
    rr(ctx,fx,fy,fw,fh,22);
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke();
    if(certImg){
      const p = 14, aw = fw-2*p, ah = fh-2*p;
      const s = Math.min(aw/certImg.naturalWidth, ah/certImg.naturalHeight);
      const iw = certImg.naturalWidth*s, ih = certImg.naturalHeight*s;
      const ix = fx+(fw-iw)/2, iy = fy+(fh-ih)/2;
      ctx.save();
      rr(ctx,ix,iy,iw,ih,14); ctx.clip();
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(certImg,ix,iy,iw,ih);
      ctx.restore();
    }

    // name
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.font = '500 18px Prompt, sans-serif';
    ctx.fillText('NAME',60,752);
    ctx.fillStyle = '#fff';
    fitText(ctx,name,800,58,24,520);
    ctx.fillText(name,60,808);

    // info row
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.font = '500 20px Prompt, sans-serif';
    ctx.textAlign = 'left'; ctx.fillText(date,60,852);
    ctx.textAlign = 'right'; ctx.fillText('NO. ' + code.replace(/-/g,''),580,852);

    // perforation
    ctx.setLineDash([10,9]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.moveTo(NOTCH+8,PERF); ctx.lineTo(W-NOTCH-8,PERF); ctx.stroke();
    ctx.setLineDash([]);

    // barcode
    let seed = 0; for(const ch of code) seed = (seed*31 + ch.charCodeAt(0)) | 0;
    const rand = rng(seed);
    ctx.fillStyle = '#2a0f4d';
    let x = 60;
    while(x < 580){
      const w = [2,2,3,5,7][Math.floor(rand()*5)];
      if(x + w > 580) break;
      ctx.fillRect(x,916,w,110);
      x += w + [2,3,4,6][Math.floor(rand()*4)];
    }

    // stub text
    ctx.textAlign = 'center'; ctx.fillStyle = '#2a0f4d';
    ctx.font = '700 20px Prompt, sans-serif';
    ctx.fillText('TICKET CODE : ' + code,W/2,1066);
    ctx.font = '800 28px Prompt, sans-serif';
    if('letterSpacing' in ctx) ctx.letterSpacing = '10px';
    ctx.fillText('ADMIT ONE',W/2+5,1102);
    if('letterSpacing' in ctx) ctx.letterSpacing = '0px';

    ctx.restore();
    return c;
  }

  /* ---------- printer sound ---------- */
  let ac;
  function click(){
    if(!soundIn.checked) return;
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if(ac.state === 'suspended') ac.resume();
      const n = Math.floor(ac.sampleRate*0.035), buf = ac.createBuffer(1,n,ac.sampleRate), data = buf.getChannelData(0);
      for(let i=0;i<n;i++) data[i] = (Math.random()*2-1)*(1-i/n);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1600 + Math.random()*1400; f.Q.value = 1.2;
      const g = ac.createGain(); g.gain.value = .28;
      src.connect(f).connect(g).connect(ac.destination); src.start();
    }catch(e){}
  }

  /* ---------- print / tear ---------- */
  function setStatus(t,printing){
    statusEl.textContent = t;
    printer.classList.toggle('printing',!!printing);
  }

  async function tear(){
    const h = ticketImg.offsetHeight;
    ticketImg.style.transition = reduced ? 'none' : 'transform .7s cubic-bezier(.55,0,.8,.4), opacity .7s ease-in';
    ticketImg.style.transform = `translateY(${h+60}px) rotate(5deg)`;
    ticketImg.style.opacity = '0';
    after.classList.remove('show');
    await sleep(reduced ? 0 : 720);
    ticketImg.style.transition = 'none';
    ticketImg.style.transform = 'translateY(-100%)';
    ticketImg.style.opacity = '1';
    hasTicket = false;
    setStatus('READY',false);
    printBtn.textContent = 'ปริ้นตั๋ว';
  }

  async function printTicket(){
    if(busy || !certImg) return;
    busy = true; printBtn.disabled = true;
    if(hasTicket) await tear();

    setStatus('PRINTING...',true);
    const canvas = await drawTicket();
    lastCanvas = canvas;
    ticketImg.style.transition = 'none';
    ticketImg.style.opacity = '1';
    ticketImg.style.transform = 'translateY(-100%)';
    ticketImg.src = canvas.toDataURL('image/png');
    try{ await ticketImg.decode(); }catch(e){}
    await sleep(350);

    const h = ticketImg.offsetHeight;
    if(reduced){
      ticketImg.style.transform = 'translateY(0)';
    }else{
      let y = -h;
      while(y < 0){
        y = Math.min(0, y + 9 + Math.random()*15);
        ticketImg.style.transform = `translateY(${y}px)`;
        click();
        await sleep(55 + Math.random()*55 + (Math.random() < .1 ? 170 : 0));
      }
    }

    setStatus('TAKE TICKET',false);
    hasTicket = true; busy = false; printBtn.disabled = false;
    printBtn.textContent = 'ปริ้นใบใหม่';
    after.classList.add('show');
  }

  printBtn.addEventListener('click', printTicket);
  tearBtn.addEventListener('click', () => { if(!busy && hasTicket){ busy = true; tear().then(() => busy = false); } });
  dlBtn.addEventListener('click', () => {
    if(!lastCanvas) return;
    lastCanvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `ticket-${lastName.replace(/[^\p{L}\p{N}_-]+/gu,'_')}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },'image/png');
  });
})();
</script>
</body>
</html>
