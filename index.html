<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Certificate RIIZE VOTE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --sky1:#aaa5f1;
  --sky2:#e4c8f7;
  --sky3:#ffe1ee;

  --ink:#33246b;

  --pink:#ff8fc3;
  --pink-deep:#d9609f;

  --butter:#ffe48a;
  --line:#c9b8ee;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
}

body{
  font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);

  min-height:100vh;
  overflow-x:hidden;

  background:
    linear-gradient(
      180deg,
      var(--sky1) 0%,
      var(--sky2) 55%,
      var(--sky3) 100%
    ) fixed;

  -webkit-font-smoothing:antialiased;
}


/* =========================================================
   BACKGROUND STARS
========================================================= */

body::before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  opacity:.9;

  background-image:
    radial-gradient(2px 2px at 24px 38px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 96px 120px,#fff,transparent),
    radial-gradient(2.5px 2.5px at 180px 60px,#fff8d6,transparent),
    radial-gradient(1.5px 1.5px at 240px 200px,#fff,transparent),
    radial-gradient(2px 2px at 60px 230px,#fff,transparent),
    radial-gradient(2.5px 2.5px at 290px 120px,#fff,transparent);

  background-size:320px 260px;
}


/* =========================================================
   PAGE
========================================================= */

.wrap{
  position:relative;

  max-width:1060px;

  margin:0 auto;
  padding:36px 24px 80px;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,400px);

  gap:56px;

  align-items:start;
}


/* =========================================================
   HEADER
========================================================= */

.head{
  display:flex;
  align-items:center;

  gap:14px;

  margin-bottom:10px;
}

.head svg,
.head-character{
  flex:none;
}

h1{
  font-family:'Mali','Prompt',sans-serif;

  font-size:clamp(30px,4.6vw,46px);
  line-height:1.2;

  margin:0;

  font-weight:700;
}

.lead{
  margin:0 0 26px;

  font-size:17px;
  line-height:1.65;

  max-width:46ch;

  color:#4b3c85;
}


/* =========================================================
   RIIZE POLAROID
   ยังคงเหมือนเดิม
========================================================= */

.polaroid{
  position:relative;

  max-width:420px;

  margin:6px 0 34px 6px;

  background:#fff;

  padding:12px 12px 10px;

  border-radius:12px;

  transform:rotate(-2.2deg);

  box-shadow:
    0 14px 26px -10px rgba(51,36,107,.4);
}

.polaroid::before{
  content:"";

  position:absolute;

  top:-13px;
  left:50%;

  width:96px;
  height:26px;

  margin-left:-48px;

  background:rgba(255,228,138,.85);

  transform:rotate(3deg);

  border-radius:3px;

  box-shadow:
    0 1px 2px rgba(51,36,107,.15);
}

.polaroid img{
  display:block;

  width:100%;

  border-radius:6px;
}

.polaroid p{
  margin:10px 4px 2px;

  font-family:'Mali','Prompt',sans-serif;

  font-weight:600;
  font-size:17px;

  display:flex;

  justify-content:space-between;

  gap:10px;
}

.polaroid p span:last-child{
  color:var(--pink-deep);
}


/* =========================================================
   CHARACTER SELECTOR
========================================================= */

.character-field{
  margin-bottom:30px;
}

.character-title{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:12px;
}

.character-title .lbl{
  margin:0;
}

.character-title small{
  color:#6a5aa3;

  font-size:13px;

  white-space:nowrap;
}

.character-list{
  display:grid;

  grid-template-columns:repeat(6,minmax(0,1fr));

  gap:10px;

  width:100%;
}

.character{
  position:relative;

  width:100%;
  aspect-ratio:1;

  padding:5px;

  border:2.5px solid rgba(255,255,255,.72);

  border-radius:18px;

  background:rgba(255,255,255,.42);

  box-shadow:none;

  cursor:pointer;

  overflow:hidden;

  transition:
    transform .15s ease,
    border-color .15s ease,
    background .15s ease,
    box-shadow .15s ease;
}

.character img{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  pointer-events:none;
}

.character:hover{
  transform:translateY(-2px);

  background:rgba(255,255,255,.8);

  border-color:var(--pink);
}

.character.selected{
  transform:translateY(-3px);

  background:#fff;

  border-color:var(--pink-deep);

  box-shadow:
    0 0 0 3px rgba(255,143,195,.20),
    0 8px 16px rgba(51,36,107,.16);
}

.character.selected::after{
  content:"✓";

  position:absolute;

  top:5px;
  right:5px;

  width:20px;
  height:20px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:var(--pink-deep);
  color:#fff;

  font-family:'Prompt',sans-serif;

  font-size:12px;
  font-weight:700;

  box-shadow:
    0 2px 6px rgba(51,36,107,.25);
}


/* =========================================================
   FORM
========================================================= */

.field{
  margin-bottom:22px;
}

.field > label,
.field > .lbl{
  display:block;

  font-family:'Mali','Prompt',sans-serif;

  font-weight:700;
  font-size:17px;

  margin-bottom:8px;
}

.field small{
  font-weight:500;

  color:#6a5aa3;

  font-family:'Prompt',sans-serif;

  font-size:14px;
}

input[type=text]{
  width:100%;

  font:inherit;
  font-size:17px;

  padding:13px 18px;

  border:2.5px solid var(--line);

  border-radius:18px;

  background:#fff;

  color:var(--ink);
}

input[type=text]::placeholder{
  color:#b3a5d6;
}

input[type=text]:focus-visible,
.drop:focus-within,
button:focus-visible,
.check input:focus-visible{
  outline:3px solid var(--pink);
  outline-offset:2px;
}


/* =========================================================
   FILE UPLOAD
========================================================= */

.drop{
  display:flex;

  align-items:center;

  gap:18px;

  border:2.5px dashed #f09ac6;

  border-radius:22px;

  padding:16px;

  background:rgba(255,255,255,.6);

  cursor:pointer;

  transition:
    background .15s,
    border-color .15s;
}

.drop:hover,
.drop.over{
  background:#fff;

  border-color:var(--pink-deep);
}

.drop input{
  position:absolute;

  opacity:0;

  width:1px;
  height:1px;
}

.thumb{
  width:84px;
  height:112px;

  flex:none;

  border-radius:14px;

  background:#efe6fb;

  display:grid;

  place-items:center;

  overflow:hidden;

  color:#a08ad6;

  font-size:32px;
}

.thumb img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.drop b{
  display:block;

  font-family:'Mali','Prompt',sans-serif;

  font-size:18px;

  margin-bottom:4px;
}

.drop .hint{
  color:#6a5aa3;

  font-size:14px;

  line-height:1.5;
}

.err{
  color:#b4235a;

  font-size:14px;

  margin-top:8px;

  min-height:1em;
}


/* =========================================================
   CHECKBOX
========================================================= */

.checks{
  display:flex;

  flex-direction:column;

  gap:12px;

  margin-bottom:28px;
}

.check{
  display:flex;

  align-items:center;

  gap:10px;

  font-size:15px;

  cursor:pointer;

  user-select:none;
}

.check input{
  width:19px;
  height:19px;

  accent-color:var(--pink-deep);
}


/* =========================================================
   BUTTON
========================================================= */

.actions{
  display:flex;

  flex-wrap:wrap;

  gap:12px;
}

button{
  font-family:'Mali','Prompt',sans-serif;

  font-weight:700;
  font-size:18px;

  border:0;

  border-radius:999px;

  padding:14px 30px;

  cursor:pointer;

  transition:
    transform .1s,
    box-shadow .1s,
    opacity .15s;
}

button:disabled{
  opacity:.45;

  cursor:not-allowed;
}

.primary{
  background:var(--pink);

  color:var(--ink);

  box-shadow:
    0 5px 0 var(--pink-deep);
}

.primary:hover:not(:disabled){
  transform:translateY(-1px);

  box-shadow:
    0 6px 0 var(--pink-deep);
}

.primary:active:not(:disabled){
  transform:translateY(4px);

  box-shadow:
    0 1px 0 var(--pink-deep);
}

.ghost{
  background:#fff;

  color:var(--ink);

  box-shadow:
    0 4px 0 var(--line);

  padding:12px 24px;

  font-size:16px;
}

.ghost:hover:not(:disabled){
  transform:translateY(-1px);
}

.ghost:active:not(:disabled){
  transform:translateY(3px);

  box-shadow:
    0 1px 0 var(--line);
}

.after{
  display:none;

  margin-top:18px;
}

.after.show{
  display:flex;
}


/* =========================================================
   PRINTER
========================================================= */

.stage{
  width:100%;

  max-width:380px;

  margin:0 auto;
}

.machine{
  position:relative;

  z-index:2;
}

.ear{
  position:absolute;

  top:-14px;

  width:46px;
  height:46px;

  border-radius:50%;

  z-index:0;

  background:
    radial-gradient(
      circle at 50% 55%,
      var(--pink) 0 34%,
      #f6f0ff 36%
    );

  box-shadow:
    inset 0 -3px 0 #d7c9f2;
}

.ear.l{
  left:20px;
}

.ear.r{
  right:20px;
}

.printer{
  position:relative;

  z-index:1;

  background:
    linear-gradient(
      180deg,
      #fbf8ff 0%,
      #e8dcfb 100%
    );

  border-radius:
    30px 30px 18px 18px;

  padding:
    22px 22px 36px;

  box-shadow:
    0 22px 34px -16px rgba(51,36,107,.5),
    inset 0 -6px 0 #d2c2f0,
    inset 0 2px 0 #fff;
}

.panel{
  display:flex;

  align-items:center;

  gap:14px;
}

.screen{
  flex:1;

  background:var(--ink);

  border-radius:12px;

  padding:9px 13px;

  font-family:
    'Courier New',
    ui-monospace,
    monospace;

  font-weight:700;
  font-size:14px;

  color:var(--butter);

  letter-spacing:.06em;

  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.5);

  white-space:nowrap;

  overflow:hidden;
}

.leds{
  display:flex;

  gap:8px;
}

.led{
  width:12px;
  height:12px;

  border-radius:50%;

  background:#cfc3ea;

  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.25);
}

.led.a{
  background:var(--butter);

  box-shadow:
    0 0 8px var(--butter);
}

.printing .led.b{
  background:var(--pink);

  box-shadow:
    0 0 8px var(--pink);

  animation:
    blink .35s steps(2) infinite;
}

@keyframes blink{
  50%{
    opacity:.25;
  }
}

  .head-character{
  width:92px;
  height:92px;
  flex:none;

  object-fit:contain;

  /* รูปมี transparent space เลยขยายภาพด้านใน */
  transform:scale(1.18);
  transform-origin:center;
}

@media(max-width:600px){
  .head-character{
    width:76px;
    height:76px;
  }
}

/* =========================================================
   PRINTER FACE
========================================================= */

.face{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:14px;

  margin:20px 0 0;
}

.eye{
  width:22px;
  height:22px;

  border-radius:50%;

  background:var(--ink);

  transition:all .15s;
}

.cheek{
  width:28px;
  height:15px;

  border-radius:50%;

  background:#ffb3d6;

  opacity:.85;
}

.mouth{
  width:14px;
  height:8px;

  border-bottom:
    3.5px solid var(--ink);

  border-radius:
    0 0 14px 14px;

  margin:0 4px;
}

.idle .eye{
  height:11px;

  background:none;

  border-bottom:
    4px solid var(--ink);

  border-radius:
    0 0 22px 22px;
}

.done .eye{
  height:11px;

  background:none;

  border-top:
    4px solid var(--ink);

  border-radius:
    22px 22px 0 0;

  margin-top:6px;
}

.printing .mouth{
  width:12px;
  height:12px;

  border:
    3.5px solid var(--ink);

  border-radius:50%;
}


/* =========================================================
   SLEEP Z
========================================================= */

.zs{
  position:absolute;

  right:34px;
  top:-34px;

  pointer-events:none;

  display:none;

  z-index:3;

  font-family:'Mali',sans-serif;

  font-weight:700;

  color:#fff;

  text-shadow:
    0 1px 0 #9a8bd6;
}

.idle .zs{
  display:block;
}

.zs span{
  position:absolute;

  right:0;
  top:0;

  opacity:0;

  font-size:22px;

  animation:
    floatz 3.6s ease-out infinite;
}

.zs span:nth-child(2){
  animation-delay:1.2s;

  font-size:26px;
}

.zs span:nth-child(3){
  animation-delay:2.4s;

  font-size:30px;
}

@keyframes floatz{
  0%{
    transform:
      translate(-6px,10px)
      scale(.7);

    opacity:0;
  }

  25%{
    opacity:1;
  }

  100%{
    transform:
      translate(18px,-30px)
      scale(1.1);

    opacity:0;
  }
}


/* =========================================================
   SLOT / TICKET
========================================================= */

.slot{
  position:absolute;

  left:6%;
  right:6%;

  bottom:-3px;

  height:18px;

  background:#1a1033;

  border-radius:9px;

  box-shadow:
    inset 0 4px 6px rgba(0,0,0,.7),
    0 1px 0 rgba(255,255,255,.8);
}

.out{
  position:relative;

  z-index:1;

  width:86%;

  margin:-10px auto 0;

  aspect-ratio:640/1224;

  clip-path:
    inset(0 -60px -900px -60px);
}

.out img{
  position:absolute;

  left:0;
  top:0;

  width:100%;

  display:block;

  transform:translateY(-100%);

  filter:
    drop-shadow(
      0 10px 14px rgba(51,36,107,.4)
    );
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:820px){

  .wrap{
    grid-template-columns:1fr;

    gap:40px;

    padding:
      26px 18px 64px;
  }

  .stage{
    order:2;
  }

  .polaroid{
    margin-right:6px;
  }
}

@media(max-width:600px){

  .character-list{
    grid-template-columns:
      repeat(3,minmax(0,1fr));

    gap:12px;
  }

  .character-title{
    align-items:flex-start;

    flex-direction:column;

    gap:2px;
  }
}

@media(prefers-reduced-motion:reduce){

  .printing .led.b{
    animation:none;
  }

  .zs span{
    animation:none;

    opacity:1;
  }

  .zs span:nth-child(2){
    transform:
      translate(10px,-14px);
  }

  .zs span:nth-child(3){
    transform:
      translate(20px,-30px);
  }
}

</style>
</head>


<body>

<div class="wrap">

  <main>

    <!-- ================= HEADER ================= -->

    <div class="head">

<img
  class="head-character"
  src="5.PNG"
  alt=""
  aria-hidden="true"
/>

      <h1>
        Marke your Certificate
        <br>
        RIIZE VOTE
      </h1>

    </div>


    <p class="lead">
      ใส่รูป certificate กับชื่อ แล้วรอตั๋วไหลออกมาจากเครื่องนะคะ~
    </p>


    <!-- ================= RIIZE POLAROID ================= -->

    <figure
      class="polaroid"
      style="margin-top:6px;margin-bottom:34px"
    >

      <img
        id="photo"
        alt="รูปหกช่อง สมาชิกวงนอนบนเตียงและใส่หูฟัง"
      >

      <p>
        <span>ตีสองแล้ว ยังไม่หลับเลย</span>
        <span>#RIIZE</span>
      </p>

    </figure>


    <!-- ================= CHARACTER SELECTOR ================= -->

    <div class="field character-field">

      <div class="character-title">

        <span class="lbl">
          เลือกเด็กบนตั๋ว ✦
        </span>

        <small id="characterCount">
          เลือกได้สูงสุด 6 ตัว
        </small>

      </div>


      <div class="character-list">

        <button
          type="button"
          class="character"
          data-src="bam.PNG"
          aria-label="เลือก Bam"
        >
          <img
            src="bam.PNG"
            alt="Bam"
          >
        </button>


        <button
          type="button"
          class="character"
          data-src="ddolbyeong.PNG"
          aria-label="เลือก Ddolbyeong"
        >
          <img
            src="ddolbyeong.PNG"
            alt="Ddolbyeong"
          >
        </button>


        <button
          type="button"
          class="character"
          data-src="meong.PNG"
          aria-label="เลือก Meong"
        >
          <img
            src="meong.PNG"
            alt="Meong"
          >
        </button>


        <button
          type="button"
          class="character"
          data-src="rizuko.PNG"
          aria-label="เลือก Rizuko"
        >
          <img
            src="rizuko.PNG"
            alt="Rizuko"
          >
        </button>


        <button
          type="button"
          class="character"
          data-src="tonyang.PNG"
          aria-label="เลือก Tonyang"
        >
          <img
            src="tonyang.PNG"
            alt="Tonyang"
          >
        </button>


        <button
          type="button"
          class="character"
          data-src="dol.PNG"
          aria-label="เลือก Dol"
        >
          <img
            src="dol.PNG"
            alt="Dol"
          >
        </button>

      </div>

    </div>


    <!-- ================= CERTIFICATE UPLOAD ================= -->

    <div class="field">

      <span class="lbl">
        รูป certificate
      </span>

      <label
        class="drop"
        id="drop"
      >

        <input
          type="file"
          id="file"
          accept="image/*"
        >

        <div
          class="thumb"
          id="thumb"
          aria-hidden="true"
        >
          +
        </div>

        <div>

          <b id="dropTitle">
            เลือกรูปภาพ
          </b>

          <span class="hint">
            คลิกเพื่อเลือกไฟล์ หรือลากรูปมาวางตรงนี้ (PNG, JPG)
          </span>

        </div>

      </label>

      <div
        class="err"
        id="err"
        role="alert"
      ></div>

    </div>


    <!-- ================= NAME ================= -->

    <div class="field">

      <label for="name">
        ชื่อบนตั๋ว
      </label>

      <input
        type="text"
        id="name"
        maxlength="28"
        placeholder="ชื่อของคุณ"
        autocomplete="off"
      >

    </div>


    <!-- ================= TITLE ================= -->

    <div class="field">

      <label for="title">
        หัวตั๋ว
        <small>
          (ไม่ใส่ก็ได้)
        </small>
      </label>

      <input
        type="text"
        id="title"
        maxlength="24"
        placeholder="INSOMNIA TICKET"
        autocomplete="off"
      >

    </div>


    <!-- ================= SOUND ================= -->

    <div class="checks">

      <label class="check">

        <input
          type="checkbox"
          id="sound"
          checked
        >

        <span>
          เปิดเสียงเครื่องพิมพ์
        </span>

      </label>

    </div>


    <!-- ================= PRINT ================= -->

    <div class="actions">

      <button
        class="primary"
        id="print"
        disabled
      >
        ปริ้นตั๋ว
      </button>

    </div>


    <div
      class="actions after"
      id="after"
    >

      <button
        class="ghost"
        id="download"
      >
        ดาวน์โหลดตั๋ว (PNG)
      </button>

      <button
        class="ghost"
        id="tear"
      >
        ฉีกตั๋วออก
      </button>

    </div>

  </main>


  <!-- =====================================================
       PRINTER
  ====================================================== -->

  <section
    class="stage"
    aria-label="เครื่องปริ้นตั๋ว"
  >

    <div class="machine">

      <i class="ear l"></i>
      <i class="ear r"></i>


      <div
        class="zs"
        aria-hidden="true"
      >
        <span>z</span>
        <span>Z</span>
        <span>Z</span>
      </div>


      <div
        class="printer idle"
        id="printer"
      >

  /* =====================================================

  function ticketPath(ctx){

    const r = 30;


    ctx.beginPath();


    ctx.moveTo(
      r,
      0

      W-r,
      0

      0,
      W,

      r
    );


    ctx.lineTo(
      W,
      PERF-NOTCH
    );


    ctx.arc(
      W,
      PERF,
      NOTCH,
      -Math.PI/2,
      Math.PI/2,
      true
    );


    ctx.lineTo(
      W,
      H-r
    );


    ctx.arcTo(
      W,
      H,
      W-r,
      H,
      r
    );


    ctx.lineTo(
      r,
      H
    );


    ctx.arcTo(
      0,
      H,
      0,
      H-r,
      r
    );


    ctx.lineTo(
      0,
      PERF+NOTCH
    );


    ctx.arc(
      0,
      PERF,
      NOTCH,
      Math.PI/2,
      -Math.PI/2,
      true
    );


    ctx.lineTo(
      0,
      r
    );


    ctx.arcTo(
      0,
      0,
      r,
      0,
      r
    );


    ctx.closePath();

  }


  /* =====================================================
     ROUNDED RECTANGLE
  ====================================================== */

  function rr(
    ctx,
    x,
    y,
    w,
    h,
    r
  ){

    ctx.beginPath();

    ctx.moveTo(
      x+r,
      y
    );


    ctx.arcTo(
      x+w,
      y,
      x+w,
      y+h,
      r
    );


    ctx.arcTo(
      x+w,
      y+h,
      x,
      y+h,
      r
    );


    ctx.arcTo(
      x,
      y+h,
      x,
      y,
      r
    );


    ctx.arcTo(
      x,
      y,
      x+w,
      y,
      r
    );


    ctx.closePath();

  }


  /* =====================================================
     SPARKLE
  ====================================================== */

  function sparkle(
    ctx,
    x,
    y,
    r,
    fill
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      y-r
    );


    ctx.quadraticCurveTo(
      x,
      y,
      x+r,
      y
    );


    ctx.quadraticCurveTo(
      x,
      y,
      x,
      y+r
    );


    ctx.quadraticCurveTo(
      x,
      y,
      x-r,
      y
    );


    ctx.quadraticCurveTo(
      x,
      y,
      x,
      y-r
    );


    ctx.fillStyle =
      fill;


    ctx.fill();

  }


  /* =====================================================

  ====================================================== */

  function moon(
    ctx,
    cx,
    cy,
    r
  ){

    const s =
      r*2+10;


    const o =
      document.createElement(
        'canvas'
      );


    o.width =
      o.height =
      s;


    const c =
      o.getContext('2d');


    const m =
      s/2;


    c.fillStyle =
      '#ffe48a';


    c.beginPath();

    c.arc(
      m,
      m,
      r,
      0,
      Math.PI*2
    );

    c.fill();


    c.globalCompositeOperation =
      'destination-out';


    c.beginPath();

    c.arc(
      m+r*.5,
      m-r*.3,
      r*.82,
      0,
      Math.PI*2
    );

    c.fill();


    ctx.save();


    ctx.shadowColor =
      'rgba(255,228,138,.7)';


    ctx.shadowBlur =
      18;


    ctx.drawImage(
      o,
      cx-m,
      cy-m
    );


    ctx.restore();

  }


  /* =====================================================
     RANDOM
  ====================================================== */

  function rng(seed){

    return () => {

      seed |= 0;


      seed =
        seed +
        0x6D2B79F5 |
        0;


      let t =
        Math.imul(
          seed ^
          seed >>> 15,
          1 | seed
        );


      t =
        t +
        Math.imul(
          t ^
          t >>> 7,
          61 | t
        ) ^
        t;


      return (
        (
          t ^
          t >>> 14
        ) >>> 0
      ) /
      4294967296;

    };

  }

  function fitText(
    ctx,
    text,
    family,
    weight,
    start,
    min,
    maxW
  ){

    let s =
      start;


    do{

      ctx.font =
        `${weight} ${s}px ${family}`;


      s -= 2;

    }
    while(
      ctx.measureText(text).width >
      maxW &&
      s > min

function drawCharacters(ctx, certificateY){

  const chars = Array.from(
    selectedCharacters.values()
  );

  if(!chars.length){
    return;
  }

  const count = chars.length;

  /*
   * ขนาดตัวละคร
   */
  const sizes = {
    1: 180,
    2: 160,
    3: 165,
    4: 128,
    5: 112,
    6: 102
  };

  const size = sizes[count];

  /*
   * ให้ตัวละครซ้อนกันเล็กน้อย
   */
  const overlaps = {
    1: 0,
    2: 12,
    3: 16,
    4: 18,
    5: 20,
    6: 22
  };

  const overlap = overlaps[count];

  const totalWidth =
    (size * count) -
    (overlap * (count - 1));

  const startX =
    (W - totalWidth) / 2;

  /*
   * ให้ตัวละครเกาะขอบบนของ Certificate
   */
  const baseY =
    certificateY - (size * 0.72);

  chars.forEach((img, index) => {

    const x =
      startX +
      index * (size - overlap);

    /*
     * ตัวตรงกลางยกขึ้น
     * ทำให้เรียงเป็นโค้งนิด ๆ
     */
    const center =
      (count - 1) / 2;

    const distance =
      Math.abs(index - center);

    const lift =
      (center - distance) * 8;

    const y =
      baseY - lift;

    ctx.save();

    /*
     * เงาแบบ sticker
     */
    ctx.shadowColor =
      'rgba(20,10,60,.30)';

    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;

    /*
     * ขยายเพิ่ม เพราะ PNG
     * มี transparent padding รอบตัว
     */
    const scale = 1.25;

    const drawSize =
      size * scale;

    const offset =
      (drawSize - size) / 2;

    ctx.drawImage(
      img,
      x - offset,
      y - offset,
      drawSize,
      drawSize
    );

    ctx.restore();

  });
}

    /* =================================================

      );

    }


    /* =================================================
       STUB
    ================================================= */

    ctx.fillStyle =

      0,

      H-PERF
    );


/* =================================================

  let ac;


  function click(){

    if(
      !soundIn.checked
    ){
      return;
    }


    try{

      ac =
        ac ||
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();


      if(
        ac.state ===
        'suspended'
      ){

        ac.resume();

      }


      const n =
        Math.floor(
          ac.sampleRate *
          0.035
        );


      const buf =
        ac.createBuffer(
          1,
          n,
          ac.sampleRate
        );


      const data =
        buf.getChannelData(0);


      for(
        let i=0;
        i<n;
        i++
      ){

        data[i] =
          (
            Math.random()*2 -
            1
          ) *
          (
            1 -
            i/n
          );

      }


      const src =
        ac.createBufferSource();


      src.buffer =
        buf;


      const f =
        ac.createBiquadFilter();


      f.type =
        'bandpass';


      f.frequency.value =
        1600 +
        Math.random()*1400;


      f.Q.value =
        1.2;


      const g =
        ac.createGain();


      g.gain.value =
        .28;


      src
        .connect(f)
        .connect(g)
        .connect(
          ac.destination
        );


      src.start();

    }
    catch(e){}

  }


  /* =====================================================
     PRINTER STATES
  ====================================================== */

  const STATES = {

    idle:
      'ZZZ... 03:00',

    printing:
      'COUNTING SHEEP...',

    done:
      'TAKE TICKET'

  };


  function setState(mode){

    statusEl.textContent =
      STATES[mode];


    printer.className =
      'printer ' +
      mode;

  }


  /* =====================================================
     TEAR
  ====================================================== */

  async function tear(){

    const h =
      ticketImg.offsetHeight;


    ticketImg.style.transition =
      reduced
        ? 'none'
        : 'transform .7s cubic-bezier(.55,0,.8,.4), opacity .7s ease-in';


    ticketImg.style.transform =
      `translateY(${h+60}px) rotate(5deg)`;


    ticketImg.style.opacity =
      '0';


    after.classList.remove(
      'show'
    );


    await sleep(
      reduced
        ? 0
        : 720
    );


    ticketImg.style.transition =
      'none';


    ticketImg.style.transform =
      'translateY(-100%)';


    ticketImg.style.opacity =
      '1';


    hasTicket =
      false;


    setState(
      'idle'
    );


    printBtn.textContent =
      'ปริ้นตั๋ว';

  }


  /* =====================================================
     PRINT
  ====================================================== */

  async function printTicket(){

    if(
      busy ||
      !certImg
    ){
      return;
    }


    busy =
      true;


    printBtn.disabled =
      true;


    if(
      hasTicket
    ){

      await tear();

    }


    setState(
      'printing'
    );


    const canvas =
      await drawTicket();


    lastCanvas =
      canvas;


    ticketImg.style.transition =
      'none';


    ticketImg.style.opacity =
      '1';


    ticketImg.style.transform =
      'translateY(-100%)';


    ticketImg.src =
      canvas.toDataURL(
        'image/png'
      );


    try{

      await ticketImg.decode();

    }
    catch(e){}


    await sleep(
      350
    );


    const h =
      ticketImg.offsetHeight;


    if(reduced){

      ticketImg.style.transform =
        'translateY(0)';

    }else{

      let y =
        -h;


      while(
        y < 0
      ){

        y =
          Math.min(
            0,

            y +
            9 +
            Math.random()*15
          );


        ticketImg.style.transform =
          `translateY(${y}px)`;


        click();


        await sleep(
          55 +
          Math.random()*55 +
          (
            Math.random() < .1
              ? 170
              : 0
          )
        );

      }

    }


    setState(
      'done'
    );


    hasTicket =
      true;


    busy =
      false;


    printBtn.disabled =
      false;


    printBtn.textContent =
      'ปริ้นใบใหม่';


    after.classList.add(
      'show'
    );

  }


  /* =====================================================
     EVENTS
  ====================================================== */

  printBtn.addEventListener(
    'click',
    printTicket
  );


  tearBtn.addEventListener(
    'click',
    () => {

      if(
        !busy &&
        hasTicket
      ){

        busy =
          true;


        tear().then(
          () =>
            busy =
            false
        );

      }

    }
  );


  dlBtn.addEventListener(
    'click',
    () => {

      if(
        !lastCanvas
      ){
        return;
      }


      lastCanvas.toBlob(
        b => {

          const a =
            document.createElement(
              'a'
            );


          a.href =
            URL.createObjectURL(b);


          a.download =
            `ticket-${
              lastName.replace(
                /[^\p{L}\p{N}_-]+/gu,
                '_'
              )
            }.png`;


          document.body.appendChild(
            a
          );


          a.click();


          a.remove();


          setTimeout(
            () =>
              URL.revokeObjectURL(
                a.href
              ),
            1000
          );

        },
        'image/png'
      );

    }
  );

})();

</script>
