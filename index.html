<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั๋วคนนอนไม่หลับ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#aaa5f1;
    --sky2:#e4c8f7;
    --sky3:#ffe1ee;
    --ink:#33246b;
    --pink:#ff8fc3;
    --pink-deep:#d9609f;
    --butter:#ffe48a;
    --line:#c9b8ee;
    --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) fixed;
    -webkit-font-smoothing:antialiased;
  }
  /* tiny stars scattered over the sky */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.9;
    background-image:
      radial-gradient(2px 2px at 24px 38px,#fff,transparent),
      radial-gradient(1.5px 1.5px at 96px 120px,#fff,transparent),
      radial-gradient(2.5px 2.5px at 180px 60px,#fff8d6,transparent),
      radial-gradient(1.5px 1.5px at 240px 200px,#fff,transparent),
      radial-gradient(2px 2px at 60px 230px,#fff,transparent),
      radial-gradient(2.5px 2.5px at 290px 120px,#fff,transparent);
    background-size:320px 260px;
  }
  .wrap{
    position:relative;
    max-width:1060px;margin:0 auto;padding:36px 24px 80px;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:56px;align-items:start;
  }
  .head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .head svg{flex:none}
  h1{font-family:'Mali','Prompt',sans-serif;font-size:clamp(30px,4.6vw,46px);line-height:1.2;margin:0;font-weight:700}
  .lead{margin:0 0 26px;font-size:17px;line-height:1.65;max-width:46ch;color:#4b3c85}

  /* ---------- polaroid ---------- */
  .polaroid{
    position:relative;max-width:420px;margin:6px 0 34px 6px;
    background:#fff;padding:12px 12px 10px;border-radius:12px;
    transform:rotate(-2.2deg);
    box-shadow:0 14px 26px -10px rgba(51,36,107,.4);
  }
  .polaroid::before{
    content:"";position:absolute;top:-13px;left:50%;width:96px;height:26px;margin-left:-48px;
    background:rgba(255,228,138,.85);transform:rotate(3deg);border-radius:3px;
    box-shadow:0 1px 2px rgba(51,36,107,.15);
  }
  .polaroid img{display:block;width:100%;border-radius:6px}
  .polaroid p{
    margin:10px 4px 2px;font-family:'Mali','Prompt',sans-serif;font-weight:600;font-size:17px;
    display:flex;justify-content:space-between;gap:10px;
  }
  .polaroid p span:last-child{color:var(--pink-deep)}

  /* ---------- form ---------- */
  .field{margin-bottom:22px}
  .field > label,.field > .lbl{display:block;font-family:'Mali','Prompt',sans-serif;font-weight:700;font-size:17px;margin-bottom:8px}
  .field small{font-weight:500;color:#6a5aa3;font-family:'Prompt',sans-serif;font-size:14px}
  input[type=text]{
    width:100%;font:inherit;font-size:17px;padding:13px 18px;
    border:2.5px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);
  }
  input[type=text]::placeholder{color:#b3a5d6}
  input[type=text]:focus-visible,.drop:focus-within,button:focus-visible,.check input:focus-visible{
    outline:3px solid var(--pink);outline-offset:2px;
  }
  .drop{
    display:flex;align-items:center;gap:18px;
    border:2.5px dashed #f09ac6;border-radius:22px;padding:16px;
    background:rgba(255,255,255,.6);cursor:pointer;transition:background .15s,border-color .15s;
  }
  .drop:hover,.drop.over{background:#fff;border-color:var(--pink-deep)}
  .drop input{position:absolute;opacity:0;width:1px;height:1px}
  .thumb{
    width:84px;height:112px;flex:none;border-radius:14px;background:#efe6fb;
    display:grid;place-items:center;overflow:hidden;color:#a08ad6;font-size:32px;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .drop b{display:block;font-family:'Mali','Prompt',sans-serif;font-size:18px;margin-bottom:4px}
  .drop .hint{color:#6a5aa3;font-size:14px;line-height:1.5}
  .err{color:#b4235a;font-size:14px;margin-top:8px;min-height:1em}

  .checks{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
  .check{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;user-select:none}
  .check input{width:19px;height:19px;accent-color:var(--pink-deep)}

  .actions{display:flex;flex-wrap:wrap;gap:12px}
  button{
    font-family:'Mali','Prompt',sans-serif;font-weight:700;font-size:18px;border:0;border-radius:999px;
    padding:14px 30px;cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .15s;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:var(--pink);color:var(--ink);box-shadow:0 5px 0 var(--pink-deep)}
  .primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 0 var(--pink-deep)}
  .primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep)}
  .ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:12px 24px;font-size:16px}
  .ghost:hover:not(:disabled){transform:translateY(-1px)}
  .ghost:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .after{display:none;margin-top:18px}
  .after.show{display:flex}

  /* ---------- printer ---------- */
  .stage{width:100%;max-width:380px;margin:0 auto}
  .machine{position:relative;z-index:2}
  .ear{
    position:absolute;top:-14px;width:46px;height:46px;border-radius:50%;z-index:0;
    background:radial-gradient(circle at 50% 55%,var(--pink) 0 34%,#f6f0ff 36%);
    box-shadow:inset 0 -3px 0 #d7c9f2;
  }
  .ear.l{left:20px}.ear.r{right:20px}
  .printer{
    position:relative;z-index:1;
    background:linear-gradient(180deg,#fbf8ff 0%,#e8dcfb 100%);
    border-radius:30px 30px 18px 18px;
    padding:22px 22px 36px;
    box-shadow:0 22px 34px -16px rgba(51,36,107,.5),inset 0 -6px 0 #d2c2f0,inset 0 2px 0 #fff;
  }
  .panel{display:flex;align-items:center;gap:14px}
  .screen{
    flex:1;background:var(--ink);border-radius:12px;padding:9px 13px;
    font-family:'Courier New',ui-monospace,monospace;font-weight:700;font-size:14px;
    color:var(--butter);letter-spacing:.06em;box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
    white-space:nowrap;overflow:hidden;
  }
  .leds{display:flex;gap:8px}
  .led{width:12px;height:12px;border-radius:50%;background:#cfc3ea;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
  .led.a{background:var(--butter);box-shadow:0 0 8px var(--butter)}
  .printing .led.b{background:var(--pink);box-shadow:0 0 8px var(--pink);animation:blink .35s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}

  .face{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px 0 0}
  .eye{width:22px;height:22px;border-radius:50%;background:var(--ink);transition:all .15s}
  .cheek{width:28px;height:15px;border-radius:50%;background:#ffb3d6;opacity:.85}
  .mouth{width:14px;height:8px;border-bottom:3.5px solid var(--ink);border-radius:0 0 14px 14px;margin:0 4px}
  .idle .eye{height:11px;background:none;border-bottom:4px solid var(--ink);border-radius:0 0 22px 22px}
  .done .eye{height:11px;background:none;border-top:4px solid var(--ink);border-radius:22px 22px 0 0;margin-top:6px}
  .printing .mouth{width:12px;height:12px;border:3.5px solid var(--ink);border-radius:50%}

  .zs{position:absolute;right:34px;top:-34px;pointer-events:none;display:none;z-index:3;font-family:'Mali',sans-serif;font-weight:700;color:#fff;text-shadow:0 1px 0 #9a8bd6}
  .idle .zs{display:block}
  .zs span{position:absolute;right:0;top:0;opacity:0;font-size:22px;animation:floatz 3.6s ease-out infinite}
  .zs span:nth-child(2){animation-delay:1.2s;font-size:26px}
  .zs span:nth-child(3){animation-delay:2.4s;font-size:30px}
  @keyframes floatz{0%{transform:translate(-6px,10px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translate(18px,-30px) scale(1.1);opacity:0}}

  .slot{
    position:absolute;left:6%;right:6%;bottom:-3px;height:18px;
    background:#1a1033;border-radius:9px;
    box-shadow:inset 0 4px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.8);
  }
  .out{
    position:relative;z-index:1;
    width:86%;margin:-10px auto 0;
    aspect-ratio:640/1224;
    clip-path:inset(0 -60px -900px -60px);
  }
  .out img{
    position:absolute;left:0;top:0;width:100%;display:block;
    transform:translateY(-100%);
    filter:drop-shadow(0 10px 14px rgba(51,36,107,.4));
  }

  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;gap:40px;padding:26px 18px 64px}
    .stage{order:2}
    .polaroid{margin-right:6px}
  }
  @media (prefers-reduced-motion:reduce){
    .printing .led.b{animation:none}
    .zs span{animation:none;opacity:1}
    .zs span:nth-child(2){transform:translate(10px,-14px)}
    .zs span:nth-child(3){transform:translate(20px,-30px)}
  }
</style>
</head>
<body>
<div class="wrap">
  <main>
    <div class="head">
      <svg width="84" height="84" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="54" r="37" fill="#ffe48a"/>
        <path d="M17 38 Q48 -8 84 30 Q56 22 17 38Z" fill="#ff8fc3"/>
        <circle cx="86" cy="32" r="7" fill="#fff"/>
        <path d="M30 56 q6 7 12 0M58 56 q6 7 12 0M46 67 q4 4 8 0" stroke="#33246b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="27" cy="66" rx="6" ry="4" fill="#ff8fc3" opacity=".75"/>
        <ellipse cx="73" cy="66" rx="6" ry="4" fill="#ff8fc3" opacity=".75"/>
      </svg>
      <h1>marke your certificate riize vote</h1>
    </div>
    <p class="lead">ใส่รูป certificate กับชื่อ แล้วรอตั๋วไหลออกมาจากเครื่องนะคะ~</p>

    <figure class="polaroid" style="margin-top:6px;margin-bottom:34px">
      <img id="photo" alt="รูปหกช่อง สมาชิกวงนอนบนเตียงและใส่หูฟัง">
      <p><span>ตีสามแล้ว ยังไม่หลับเลย</span><span>#RIIZE</span></p>
    </figure>

    <div class="field">
      <span class="lbl">รูป certificate</span>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*">
        <div class="thumb" id="thumb" aria-hidden="true">+</div>
        <div>
          <b id="dropTitle">เลือกรูปภาพ</b>
          <span class="hint">คลิกเพื่อเลือกไฟล์ หรือลากรูปมาวางตรงนี้ (PNG, JPG)</span>
        </div>
      </label>
      <div class="err" id="err" role="alert"></div>
    </div>

    <div class="field">
      <label for="name">ชื่อบนตั๋ว</label>
      <input type="text" id="name" maxlength="28" placeholder="ชื่อของคุณ" autocomplete="off">
    </div>

    <div class="field">
      <label for="title">หัวตั๋ว <small>(ไม่ใส่ก็ได้)</small></label>
      <input type="text" id="title" maxlength="24" placeholder="INSOMNIA TICKET" autocomplete="off">
    </div>

    <div class="checks">
      <label class="check"><input type="checkbox" id="photos" checked><span>ใส่แถบรูป RIIZE บนตั๋ว</span></label>
      <label class="check"><input type="checkbox" id="sound" checked><span>เปิดเสียงเครื่องพิมพ์</span></label>
    </div>

    <div class="actions">
      <button class="primary" id="print" disabled>ปริ้นตั๋ว</button>
    </div>
    <div class="actions after" id="after">
      <button class="ghost" id="download">ดาวน์โหลดตั๋ว (PNG)</button>
      <button class="ghost" id="tear">ฉีกตั๋วออก</button>
    </div>
  </main>

  <section class="stage" aria-label="เครื่องปริ้นตั๋ว">
    <div class="machine">
      <i class="ear l"></i><i class="ear r"></i>
      <div class="zs" aria-hidden="true"><span>z</span><span>Z</span><span>Z</span></div>
      <div class="printer idle" id="printer">
        <div class="panel">
          <div class="screen" id="status">ZZZ... 03:00</div>
          <div class="leds"><span class="led a"></span><span class="led b"></span></div>
        </div>
        <div class="face" aria-hidden="true">
          <i class="cheek"></i><i class="eye"></i><i class="mouth"></i><i class="eye"></i><i class="cheek"></i>
        </div>
        <div class="slot"></div>
      </div>
    </div>
    <div class="out" id="out"><img id="ticket" alt="ตั๋วที่ปริ้นออกมา"></div>
  </section>
</div>

<script>
(() => {
  const PHOTO_SRC = '/images/riize.jpg';
  const $ = s => document.querySelector(s);
  const fileIn = $('#file'), drop = $('#drop'), thumb = $('#thumb'), dropTitle = $('#dropTitle'), errEl = $('#err');
  const nameIn = $('#name'), titleIn = $('#title'), soundIn = $('#sound'), photosIn = $('#photos');
  const printBtn = $('#print'), after = $('#after'), dlBtn = $('#download'), tearBtn = $('#tear');
  const statusEl = $('#status'), printer = $('#printer'), ticketImg = $('#ticket');

  const riize = new Image();
  riize.src = PHOTO_SRC;
  $('#photo').src = PHOTO_SRC;

  let certImg = null, lastCanvas = null, busy = false, hasTicket = false, lastName = '';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- image input ---------- */
  function loadFile(f){
    errEl.textContent = '';
    if(!f) return;
    if(!f.type.startsWith('image/')){ errEl.textContent = 'ไฟล์นี้ไม่ใช่รูปภาพ ลองเลือกไฟล์ PNG หรือ JPG'; return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      certImg = img;
      thumb.innerHTML = '';
      const t = new Image(); t.src = url; t.alt = '';
      thumb.appendChild(t);
      dropTitle.textContent = 'เปลี่ยนรูป';
      printBtn.disabled = busy;
    };
    img.onerror = () => { errEl.textContent = 'เปิดรูปนี้ไม่ได้ ลองไฟล์อื่น'; };
    img.src = url;
  }
  fileIn.addEventListener('change', e => loadFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
  nameIn.addEventListener('keydown', e => { if(e.key === 'Enter') printTicket(); });

  /* ---------- ticket drawing (canvas) ---------- */
  const W = 640, H = 1224, PERF = 984, NOTCH = 26;
  const CUTE = 'Mali, Prompt, sans-serif';

  function ticketPath(ctx){
    const r = 30;
    ctx.beginPath();
    ctx.moveTo(r,0);
    ctx.lineTo(W-r,0); ctx.arcTo(W,0,W,r,r);
    ctx.lineTo(W,PERF-NOTCH); ctx.arc(W,PERF,NOTCH,-Math.PI/2,Math.PI/2,true);
    ctx.lineTo(W,H-r); ctx.arcTo(W,H,W-r,H,r);
    ctx.lineTo(r,H); ctx.arcTo(0,H,0,H-r,r);
    ctx.lineTo(0,PERF+NOTCH); ctx.arc(0,PERF,NOTCH,Math.PI/2,-Math.PI/2,true);
    ctx.lineTo(0,r); ctx.arcTo(0,0,r,0,r);
    ctx.closePath();
  }
  function rr(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function sparkle(ctx,x,y,r,fill){
    ctx.beginPath();
    ctx.moveTo(x,y-r);
    ctx.quadraticCurveTo(x,y,x+r,y); ctx.quadraticCurveTo(x,y,x,y+r);
    ctx.quadraticCurveTo(x,y,x-r,y); ctx.quadraticCurveTo(x,y,x,y-r);
    ctx.fillStyle = fill; ctx.fill();
  }
  function moon(ctx,cx,cy,r){
    const s = r*2+10, o = document.createElement('canvas'); o.width = o.height = s;
    const c = o.getContext('2d'), m = s/2;
    c.fillStyle = '#ffe48a'; c.beginPath(); c.arc(m,m,r,0,Math.PI*2); c.fill();
    c.globalCompositeOperation = 'destination-out';
    c.beginPath(); c.arc(m+r*.5,m-r*.3,r*.82,0,Math.PI*2); c.fill();
    ctx.save(); ctx.shadowColor = 'rgba(255,228,138,.7)'; ctx.shadowBlur = 18;
    ctx.drawImage(o,cx-m,cy-m); ctx.restore();
  }
  function rng(seed){ // mulberry32
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function fitText(ctx,text,family,weight,start,min,maxW){
    let s = start;
    do { ctx.font = `${weight} ${s}px ${family}`; s -= 2; }
    while(ctx.measureText(text).width > maxW && s > min);
  }
  const pad = n => String(n).padStart(2,'0');

  async function drawTicket(){
    const name = (nameIn.value.trim() || 'GUEST');
    const title = (titleIn.value.trim() || 'INSOMNIA TICKET');
    const withPhotos = photosIn.checked;
    lastName = name;
    try{
      await Promise.all([
        document.fonts.load('700 42px Mali', name + title + 'zZ'),
        document.fonts.load('500 20px Prompt', 'TICKET CODE NAME NO.'),
        riize.decode()
      ]);
    }catch(e){}

    const code = `${100+Math.floor(Math.random()*900)}-${100+Math.floor(Math.random()*900)}-${1000+Math.floor(Math.random()*9000)}`;
    const d = new Date();
    const date = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;

    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    ctx.save();
    ticketPath(ctx); ctx.clip();

    // night sky body
    let g = ctx.createLinearGradient(0,0,W*.6,PERF);
    g.addColorStop(0,'#4d3cae'); g.addColorStop(1,'#241a63');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    g = ctx.createRadialGradient(560,150,0,560,150,340);
    g.addColorStop(0,'rgba(255,143,195,.42)'); g.addColorStop(1,'rgba(255,143,195,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,PERF);
    g = ctx.createRadialGradient(50,860,0,50,860,320);
    g.addColorStop(0,'rgba(150,120,255,.4)'); g.addColorStop(1,'rgba(150,120,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,PERF);

    // stars
    const sr = rng(11);
    for(let i=0;i<70;i++){
      ctx.fillStyle = `rgba(255,255,255,${.3+sr()*.55})`;
      ctx.beginPath(); ctx.arc(sr()*W, sr()*PERF, .8+sr()*1.8, 0, Math.PI*2); ctx.fill();
    }
    for(let i=0;i<9;i++) sparkle(ctx, 30+sr()*(W-60), 20+sr()*(PERF-60), 6+sr()*8, 'rgba(255,228,138,.9)');

    // stub
    ctx.fillStyle = '#ffc4de'; ctx.fillRect(0,PERF,W,H-PERF);

    // photo strip (or sleepy z's)
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    if(withPhotos && riize.naturalWidth){
      const pw = riize.naturalWidth/3, ph = riize.naturalHeight/2, t = 82, gap = (520-6*t)/5;
      for(let i=0;i<6;i++){
        const x = 60 + i*(t+gap), y = 36;
        ctx.save(); rr(ctx,x,y,t,t,16); ctx.clip();
        ctx.drawImage(riize,(i%3)*pw,Math.floor(i/3)*ph,pw,ph,x,y,t,t);
        ctx.restore();
        rr(ctx,x,y,t,t,16); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
      }
    }else{
      ctx.fillStyle = 'rgba(255,228,138,.95)';
      ctx.font = `700 46px ${CUTE}`; ctx.fillText('z',64,98);
      ctx.font = `700 34px ${CUTE}`; ctx.fillText('Z',112,86);
      ctx.font = `700 26px ${CUTE}`; ctx.fillText('z',150,72);
    }

    // title + moon
    ctx.fillStyle = '#ffc4de';
    fitText(ctx,title,CUTE,700,44,22,430);
    ctx.fillText(title,60,178);
    moon(ctx,548,150,28);

    // certificate frame
    const fx = 60, fy = 206, fw = 520, fh = 596;
    rr(ctx,fx,fy,fw,fh,24);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
    if(certImg){
      const p = 14, aw = fw-2*p, ah = fh-2*p;
      const s = Math.min(aw/certImg.naturalWidth, ah/certImg.naturalHeight);
      const iw = certImg.naturalWidth*s, ih = certImg.naturalHeight*s;
      const ix = fx+(fw-iw)/2, iy = fy+(fh-ih)/2;
      ctx.save();
      rr(ctx,ix,iy,iw,ih,16); ctx.clip();
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(certImg,ix,iy,iw,ih);
      ctx.restore();
    }

    // name
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.font = '500 18px Prompt, sans-serif';
    ctx.fillText('NAME',60,846);
    ctx.fillStyle = '#fff';
    fitText(ctx,name,CUTE,700,58,24,520);
    ctx.fillText(name,60,902);

    // info row
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.font = '500 20px Prompt, sans-serif';
    ctx.textAlign = 'left'; ctx.fillText(date,60,948);
    ctx.textAlign = 'right'; ctx.fillText('NO. ' + code.replace(/-/g,''),580,948);

    // perforation
    ctx.setLineDash([10,9]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.moveTo(NOTCH+8,PERF); ctx.lineTo(W-NOTCH-8,PERF); ctx.stroke();
    ctx.setLineDash([]);

    // barcode
    let seed = 0; for(const ch of code) seed = (seed*31 + ch.charCodeAt(0)) | 0;
    const rand = rng(seed);
    ctx.fillStyle = '#33246b';
    let x = 60;
    while(x < 580){
      const w = [2,2,3,5,7][Math.floor(rand()*5)];
      if(x + w > 580) break;
      ctx.fillRect(x,PERF+36,w,110);
      x += w + [2,3,4,6][Math.floor(rand()*4)];
    }

    // stub text
    ctx.textAlign = 'center'; ctx.fillStyle = '#33246b';
    ctx.font = '700 20px Prompt, sans-serif';
    ctx.fillText('TICKET CODE : ' + code,W/2,PERF+186);
    ctx.font = `700 28px ${CUTE}`;
    if('letterSpacing' in ctx) ctx.letterSpacing = '8px';
    ctx.fillText('ADMIT ONE',W/2+4,PERF+222);
    if('letterSpacing' in ctx) ctx.letterSpacing = '0px';

    ctx.restore();
    return c;
  }

  /* ---------- printer sound ---------- */
  let ac;
  function click(){
    if(!soundIn.checked) return;
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if(ac.state === 'suspended') ac.resume();
      const n = Math.floor(ac.sampleRate*0.035), buf = ac.createBuffer(1,n,ac.sampleRate), data = buf.getChannelData(0);
      for(let i=0;i<n;i++) data[i] = (Math.random()*2-1)*(1-i/n);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1600 + Math.random()*1400; f.Q.value = 1.2;
      const g = ac.createGain(); g.gain.value = .28;
      src.connect(f).connect(g).connect(ac.destination); src.start();
    }catch(e){}
  }

  /* ---------- print / tear ---------- */
  const STATES = { idle:'ZZZ... 03:00', printing:'COUNTING SHEEP...', done:'TAKE TICKET' };
  function setState(mode){
    statusEl.textContent = STATES[mode];
    printer.className = 'printer ' + mode;
  }

  async function tear(){
    const h = ticketImg.offsetHeight;
    ticketImg.style.transition = reduced ? 'none' : 'transform .7s cubic-bezier(.55,0,.8,.4), opacity .7s ease-in';
    ticketImg.style.transform = `translateY(${h+60}px) rotate(5deg)`;
    ticketImg.style.opacity = '0';
    after.classList.remove('show');
    await sleep(reduced ? 0 : 720);
    ticketImg.style.transition = 'none';
    ticketImg.style.transform = 'translateY(-100%)';
    ticketImg.style.opacity = '1';
    hasTicket = false;
    setState('idle');
    printBtn.textContent = 'ปริ้นตั๋ว';
  }

  async function printTicket(){
    if(busy || !certImg) return;
    busy = true; printBtn.disabled = true;
    if(hasTicket) await tear();

    setState('printing');
    const canvas = await drawTicket();
    lastCanvas = canvas;
    ticketImg.style.transition = 'none';
    ticketImg.style.opacity = '1';
    ticketImg.style.transform = 'translateY(-100%)';
    ticketImg.src = canvas.toDataURL('image/png');
    try{ await ticketImg.decode(); }catch(e){}
    await sleep(350);

    const h = ticketImg.offsetHeight;
    if(reduced){
      ticketImg.style.transform = 'translateY(0)';
    }else{
      let y = -h;
      while(y < 0){
        y = Math.min(0, y + 9 + Math.random()*15);
        ticketImg.style.transform = `translateY(${y}px)`;
        click();
        await sleep(55 + Math.random()*55 + (Math.random() < .1 ? 170 : 0));
      }
    }

    setState('done');
    hasTicket = true; busy = false; printBtn.disabled = false;
    printBtn.textContent = 'ปริ้นใบใหม่';
    after.classList.add('show');
  }

  printBtn.addEventListener('click', printTicket);
  tearBtn.addEventListener('click', () => { if(!busy && hasTicket){ busy = true; tear().then(() => busy = false); } });
  dlBtn.addEventListener('click', () => {
    if(!lastCanvas) return;
    lastCanvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `ticket-${lastName.replace(/[^\p{L}\p{N}_-]+/gu,'_')}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },'image/png');
  });
})();
</script>
